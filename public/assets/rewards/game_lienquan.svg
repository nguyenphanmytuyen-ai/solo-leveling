<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="lqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A080C"/>
      <stop offset="50%" stopColor="#4C0519"/>
      <stop offset="100%" stopColor="#140206"/>
    </linearGradient>
    <linearGradient id="lqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#B45309"/>
    </linearGradient>
    <linearGradient id="lqRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F43F5E"/>
      <stop offset="100%" stopColor="#9F1239"/>
    </linearGradient>
    <filter id="lqGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arena Crimson Background -->
  <rect width="640" height="360" fill="url(#lqBg)"/>

  <!-- Energy Beams & Winged Crest Outline -->
  <g opacity="0.35">
    <polygon points="320,30 200,160 220,180 320,80 420,180 440,160" fill="url(#lqGold)"/>
    <line x1="0" y1="0" x2="320" y2="150" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="640" y1="0" x2="320" y2="150" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Arena Shield & Crossed Wings Emblem -->
  <g transform="translate(320, 145)" filter="url(#lqGlow)">
    <!-- Outer Shield -->
    <path d="M 0,-60 L 52,-35 L 42,30 L 0,65 L -42,30 L -52,-35 Z" fill="#1C0308" stroke="url(#lqGold)" stroke-width="3"/>
    <!-- Inner Shield Ruby -->
    <path d="M 0,-48 L 40,-26 L 32,24 L 0,52 L -32,24 L -40,-26 Z" fill="url(#lqRuby)"/>
    <!-- Golden Lion Crest / Star -->
    <polygon points="0,-25 7,-7 25,-7 11,4 16,22 0,11 -16,22 -11,4 -25,-7 -7,-7" fill="url(#lqGold)"/>
    <circle cx="0" cy="0" r="4" fill="#FEF08A"/>
  </g>

  <!-- Game Title Badge -->
  <rect x="180" y="248" width="280" height="38" rx="8" fill="#180206" stroke="url(#lqGold)" stroke-width="1.5"/>
  <text x="320" y="273" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FBBF24" text-anchor="middle" letter-spacing="2">LIÊN QUÂN MOBILE</text>

  <!-- Level Badge -->
  <rect x="250" y="298" width="140" height="24" rx="6" fill="#4C0519" stroke="#FB7185" stroke-width="1"/>
  <text x="320" y="315" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#FECDD3" text-anchor="middle" letter-spacing="1">YÊU CẦU: LV.15</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hsrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#180B2E"/>
      <stop offset="50%" stopColor="#2E1065"/>
      <stop offset="100%" stopColor="#0F051D"/>
    </linearGradient>
    <linearGradient id="hsrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047"/>
      <stop offset="100%" stopColor="#CA8A04"/>
    </linearGradient>
    <linearGradient id="hsrCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#6366F1"/>
    </linearGradient>
    <filter id="hsrGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cosmic Background -->
  <rect width="640" height="360" fill="url(#hsrBg)"/>

  <!-- Space Tracks & Nebula Lines -->
  <path d="M 0 180 Q 200 80 400 140 T 640 60" fill="none" stroke="url(#hsrCyan)" stroke-width="2" opacity="0.4"/>
  <path d="M 0 220 Q 240 280 440 200 T 640 260" fill="none" stroke="url(#hsrGold)" stroke-width="1.5" opacity="0.3"/>

  <!-- Stellar Jade Diamond Icon -->
  <g transform="translate(320, 145)" filter="url(#hsrGlow)">
    <polygon points="0,-65 48,-20 0,65 -48,-20" fill="url(#hsrCyan)" opacity="0.85"/>
    <polygon points="0,-55 38,-18 0,55 -38,-18" fill="#1E1B4B" stroke="url(#hsrGold)" stroke-width="2.5"/>
    <!-- Inner Star Core -->
    <polygon points="0,-25 18,0 0,25 -18,0" fill="url(#hsrGold)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Game Title Badge -->
  <rect x="180" y="248" width="280" height="38" rx="8" fill="#130726" stroke="url(#hsrGold)" stroke-width="1.5"/>
  <text x="320" y="273" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FDE047" text-anchor="middle" letter-spacing="2">HONKAI: STAR RAIL</text>

  <!-- Level Badge -->
  <rect x="250" y="298" width="140" height="24" rx="6" fill="#3B0764" stroke="#A855F7" stroke-width="1"/>
  <text x="320" y="315" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#E9D5FF" text-anchor="middle" letter-spacing="1">YÊU CẦU: LV.12</text>
</svg>
